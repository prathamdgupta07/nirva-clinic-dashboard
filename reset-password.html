<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nirva — Reset Password</title>
<style>
:root {
  --bg: #F5F7FA;
  --card-bg: #FFFFFF;
  --border: #EAEDF2;
  --text-dark: #1A1F2B;
  --text-muted: #7C8493;
  --blue: #3B82F6;
  --blue-soft: #EAF2FE;
  --purple: #8B5CF6;
  --green: #22C55E;
  --green-soft: #EAFBF1;
  --red: #EF4444;
  --red-soft: #FDECEC;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color: var(--text-dark);
  background-color: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

.card {
  width: 100%;
  max-width: 380px;
  background-color: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 36px 32px;
  box-shadow: 0 4px 24px rgba(26, 31, 43, 0.06);
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 26px;
}

.brand .logo {
  width: 34px;
  height: 34px;
  border-radius: 9px;
  background: linear-gradient(135deg, var(--blue), var(--purple));
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 15px;
}

.brand span { font-weight: 700; font-size: 17px; }

h1 { font-size: 20px; font-weight: 700; margin: 0 0 4px; }
.subtitle { font-size: 13.5px; color: var(--text-muted); margin: 0 0 26px; }

/* ---------- Banners ---------- */
.banner {
  display: none;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  font-weight: 600;
  padding: 10px 14px;
  border-radius: 10px;
  margin-bottom: 18px;
}

.banner.show { display: flex; }
.banner svg { width: 16px; height: 16px; flex-shrink: 0; }

.banner-error { background-color: var(--red-soft); color: #B91C1C; }
.banner-success { background-color: var(--green-soft); color: #15803D; }
.banner-info { background-color: var(--blue-soft); color: #1D4ED8; }

/* ---------- Form ---------- */
.field { margin-bottom: 16px; }

.field label {
  display: block;
  font-size: 12.5px;
  font-weight: 600;
  margin-bottom: 6px;
}

.field input {
  width: 100%;
  padding: 11px 13px;
  border: 1px solid var(--border);
  border-radius: 10px;
  font-size: 14px;
  font-family: inherit;
  color: var(--text-dark);
  background-color: var(--bg);
  outline: none;
  transition: border-color 0.15s ease, background-color 0.15s ease;
}

.field input::placeholder { color: #A6ADBB; }

.field input:focus {
  border-color: var(--blue);
  background-color: var(--card-bg);
}

.field.error input {
  border-color: var(--red);
  background-color: var(--red-soft);
}

/* ---------- Button ---------- */
.btn-primary {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 10px;
  background-color: var(--blue);
  color: white;
  font-size: 14.5px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-top: 8px;
  transition: background-color 0.15s ease, opacity 0.15s ease;
}

.btn-primary:hover { background-color: #2f6fe0; }

.btn-primary.loading {
  opacity: 0.75;
  cursor: default;
  pointer-events: none;
}

.spinner {
  display: none;
  width: 15px;
  height: 15px;
  border: 2px solid rgba(255,255,255,0.4);
  border-top-color: white;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}

.btn-primary.loading .spinner { display: inline-block; }
.btn-primary.loading .btn-label { display: none; }

@keyframes spin { to { transform: rotate(360deg); } }

.footnote-form {
  text-align: center;
  font-size: 12.5px;
  color: var(--text-muted);
  margin-top: 22px;
}

.footnote-form a { color: var(--blue); text-decoration: none; font-weight: 600; }
.footnote-form a:hover { text-decoration: underline; }
</style>
<link rel="stylesheet" href="clinic-theme.css">
</head>
<body>

<div class="card">
  <div class="brand">
    <div class="logo">N</div>
    <span>Nirva AI</span>
  </div>

  <h1 id="pageTitle">Set a new password</h1>
  <p class="subtitle" id="pageSubtitle">Choose a new password for your staff account.</p>

  <div class="banner banner-error" id="errorBanner">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
    <span id="errorText">Something went wrong.</span>
  </div>

  <div class="banner banner-success" id="successBanner">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9 12l2 2 4-4"/></svg>
    <span>Password updated. Redirecting you to login&hellip;</span>
  </div>

  <div class="banner banner-info" id="invalidLinkBanner">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
    <span>This reset link is invalid or has expired. Request a new one from the login page.</span>
  </div>

  <form id="resetForm">
    <div class="field" id="passwordField">
      <label for="newPassword">New password</label>
      <input type="password" id="newPassword" placeholder="••••••••" autocomplete="new-password">
    </div>
    <div class="field" id="confirmField">
      <label for="confirmPassword">Confirm password</label>
      <input type="password" id="confirmPassword" placeholder="••••••••" autocomplete="new-password">
    </div>

    <button type="submit" class="btn-primary" id="submitBtn">
      <span class="btn-label">Update password</span>
      <span class="spinner"></span>
    </button>
  </form>

  <p class="footnote-form"><a href="login.html">Back to login</a></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js?v=20261001"></script>
<script>
  // ---------- Elements ----------
  var form = document.getElementById("resetForm");
  var submitBtn = document.getElementById("submitBtn");
  var errorBanner = document.getElementById("errorBanner");
  var errorText = document.getElementById("errorText");
  var successBanner = document.getElementById("successBanner");
  var invalidLinkBanner = document.getElementById("invalidLinkBanner");
  var newPasswordInput = document.getElementById("newPassword");
  var confirmPasswordInput = document.getElementById("confirmPassword");
  var pageTitle = document.getElementById("pageTitle");
  var pageSubtitle = document.getElementById("pageSubtitle");

  var recoverySessionReady = false;

  function showError(message) {
    errorText.textContent = message;
    errorBanner.classList.add("show");
    document.getElementById("passwordField").classList.add("error");
    document.getElementById("confirmField").classList.add("error");
  }

  function clearError() {
    errorBanner.classList.remove("show");
    document.getElementById("passwordField").classList.remove("error");
    document.getElementById("confirmField").classList.remove("error");
  }

  function showInvalidLink() {
    recoverySessionReady = false;
    invalidLinkBanner.classList.add("show");
    form.style.display = "none";
    pageTitle.textContent = "Reset link invalid";
    pageSubtitle.textContent = "";
  }

  function showFormReady() {
    recoverySessionReady = true;
    invalidLinkBanner.classList.remove("show");
    form.style.display = "block";
  }

  // ---------- Detect recovery session ----------
  // Supabase's client auto-parses the recovery token from the URL fragment
  // (detectSessionInUrl defaults to true) and fires PASSWORD_RECOVERY.
  supabaseClient.auth.onAuthStateChange(function (event, session) {
    if (event === "PASSWORD_RECOVERY") {
      showFormReady();
    } else if (event === "SIGNED_IN" && session && !recoverySessionReady) {
      // Some Supabase versions surface the recovery session as SIGNED_IN
      // rather than PASSWORD_RECOVERY depending on client version/config.
      showFormReady();
    }
  });

  // Fallback: if no recovery event fires shortly after load, check whether
  // a session exists at all. If not, the link was invalid/expired.
  (async function checkInitialSession() {
    var { data } = await supabaseClient.auth.getSession();
    if (data && data.session) {
      // A session is present — treat it as a valid recovery session.
      showFormReady();
    } else {
      setTimeout(async function () {
        if (recoverySessionReady) return;
        var { data: recheck } = await supabaseClient.auth.getSession();
        if (recheck && recheck.session) {
          showFormReady();
        } else {
          showInvalidLink();
        }
      }, 1200);
    }
  })();

  // ---------- Form submit ----------
  form.addEventListener("submit", async function (event) {
    event.preventDefault();
    clearError();

    if (!recoverySessionReady) {
      showError("This reset link is invalid or has expired. Request a new one from the login page.");
      return;
    }

    var newPassword = newPasswordInput.value;
    var confirmPassword = confirmPasswordInput.value;

    if (newPassword.length < 8) {
      showError("Password must be at least 8 characters.");
      return;
    }

    if (newPassword !== confirmPassword) {
      showError("Passwords do not match.");
      return;
    }

    submitBtn.classList.add("loading");

    var { error } = await supabaseClient.auth.updateUser({ password: newPassword });

    submitBtn.classList.remove("loading");

    if (error) {
      showError(error.message || "Could not update password. Please try again.");
      return;
    }

    form.style.display = "none";
    successBanner.classList.add("show");
    pageSubtitle.textContent = "";

    setTimeout(function () {
      window.location.href = "login.html";
    }, 2000);
  });
</script>

</body>
</html>
