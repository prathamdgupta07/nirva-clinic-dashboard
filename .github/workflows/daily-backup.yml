# Daily backup of the Riya / Nirva Supabase databases to Google Drive.
#
# What it does, every night at 2:00 AM India time:
#   1. A temporary GitHub machine copies each database (users, roles, tables
#      and all rows) with the official Supabase CLI ("supabase db dump").
#   2. It locks the copy in a password-protected .7z file (AES-256, file
#      names hidden too).
#   3. It uploads the locked file to the "Nirva Backups" folder in Pratham's
#      private Google Drive:
#        <db>/daily/    every night's copy, kept for 1 year (365 days)
#        <db>/monthly/  the first copy of each month, kept for 3 years
#      Older copies are deleted automatically.
#   4. The machine is then thrown away. Nothing from the database is ever
#      saved on GitHub: no commits, no artifacts, nothing in the logs.
#
# Secrets it needs (GitHub > Settings > Secrets and variables > Actions):
#   BACKUP_PASSWORD  - password that locks every backup file (required)
#   RCLONE_CONFIG    - Google Drive sign-in made with rclone (required)
#   SARVAM_DB_URL    - Session pooler connection string, Sarvam Riya database
#   MAIN_DB_URL      - Session pooler connection string, main dashboard database
# A database whose secret is empty is skipped with a warning.
#
# Setup and restore steps: see BACKUP_AND_RESTORE.md in this repository.

name: Daily database backup

on:
  schedule:
    - cron: "30 20 * * *" # 20:30 UTC = 2:00 AM IST
  workflow_dispatch: # lets you press "Run workflow" by hand

permissions:
  contents: read

concurrency:
  group: daily-db-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Back up ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sarvam
            secret: SARVAM_DB_URL
          - name: main
            secret: MAIN_DB_URL

    env:
      DB_URL: ${{ secrets[matrix.secret] }}
      BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
      RCLONE_CONFIG_TEXT: ${{ secrets.RCLONE_CONFIG }}
      DRIVE_FOLDER: "nirvadrive:Nirva Backups"

    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -z "$BACKUP_PASSWORD" ]; then
            echo "::error::BACKUP_PASSWORD secret is missing. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ -z "$RCLONE_CONFIG_TEXT" ]; then
            echo "::error::RCLONE_CONFIG secret is missing, so there is nowhere to save the backup. See BACKUP_AND_RESTORE.md."
            exit 1
          fi
          if [ -z "$DB_URL" ]; then
            echo "::warning::${{ matrix.secret }} secret is not set, so the ${{ matrix.name }} database was NOT backed up."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Supabase CLI
        if: steps.check.outputs.skip == 'false'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Dump database
        if: steps.check.outputs.skip == 'false'
        run: |
          set -euo pipefail
          STAMP="$(TZ=Asia/Kolkata date +%Y-%m-%d_%H%M)-IST"
          DIR="nirva-${{ matrix.name }}-${STAMP}"
          mkdir -p "work/$DIR"
          cd "work/$DIR"

          supabase db dump --db-url "$DB_URL" -f roles.sql --role-only
          supabase db dump --db-url "$DB_URL" -f schema.sql
          supabase db dump --db-url "$DB_URL" -f data.sql --data-only --use-copy

          # A real database always has a schema; an empty file means the dump failed.
          for f in roles.sql schema.sql data.sql; do
            [ -s "$f" ] || { echo "::error::$f is empty, backup failed"; exit 1; }
          done
          grep -q "CREATE TABLE" schema.sql || { echo "::error::schema.sql has no tables, backup failed"; exit 1; }

          {
            echo "Nirva database backup"
            echo "Database: ${{ matrix.name }}"
            echo "Taken: $STAMP"
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "Rows per table in this backup:"
            awk '/^COPY /{t=$2; n=0; next} /^\\\.$/{if(t!="") print "  " t ": " n; t=""; next} t!=""{n++}' data.sql
            echo
            echo "How to restore: see BACKUP_AND_RESTORE.md in the GitHub repository."
          } > README.txt

          ls -la
          echo "DIR=$DIR" >> "$GITHUB_ENV"

      - name: Lock backup with password
        if: steps.check.outputs.skip == 'false'
        run: |
          set -euo pipefail
          command -v 7z >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full; }
          cd work
          7z a -t7z -mx=9 -mhe=on "-p${BACKUP_PASSWORD}" "../${DIR}.7z" "$DIR" > /dev/null
          cd ..
          # Prove the locked file opens with the password before saving it.
          7z t "-p${BACKUP_PASSWORD}" "${DIR}.7z" > /dev/null
          rm -rf work
          ls -la "${DIR}.7z"
          echo "Saved ${DIR}.7z ($(du -h "${DIR}.7z" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload to Google Drive
        if: steps.check.outputs.skip == 'false'
        run: |
          set -euo pipefail
          command -v rclone >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq rclone; }
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONFIG_TEXT" > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          BASE="$DRIVE_FOLDER/${{ matrix.name }}"

          # Every night's copy goes to daily/.
          rclone copy "${DIR}.7z" "$BASE/daily/" --retries 5
          # Confirm it really arrived before calling this a success.
          rclone lsf "$BASE/daily/" | grep -qxF "${DIR}.7z" \
            || { echo "::error::Upload to Google Drive could not be confirmed"; exit 1; }
          echo "Uploaded: Nirva Backups/${{ matrix.name }}/daily/${DIR}.7z" >> "$GITHUB_STEP_SUMMARY"

          # The first successful copy of each month also goes to monthly/.
          # (If the run on the 1st fails, the next good night fills the gap.)
          MONTH="$(TZ=Asia/Kolkata date +%Y-%m)"
          if ! rclone lsf "$BASE/monthly/" 2>/dev/null | grep -qF -- "-${MONTH}-"; then
            rclone copy "${DIR}.7z" "$BASE/monthly/" --retries 5
            rclone lsf "$BASE/monthly/" | grep -qxF "${DIR}.7z" \
              || { echo "::error::Monthly copy to Google Drive could not be confirmed"; exit 1; }
            echo "Also saved as this month's copy: Nirva Backups/${{ matrix.name }}/monthly/${DIR}.7z" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Delete old Drive copies (daily after 1 year, monthly after 3 years)
        if: steps.check.outputs.skip == 'false'
        run: |
          set -euo pipefail
          # Only touches files this backup job created (Drive access is limited
          # to its own files). Deleted copies go to Drive's Bin first.
          BASE="$DRIVE_FOLDER/${{ matrix.name }}"
          rclone delete "$BASE/daily/"   --min-age 365d  --include "*.7z" -v 2>&1 | tail -n 20
          rclone delete "$BASE/monthly/" --min-age 1095d --include "*.7z" -v 2>&1 | tail -n 20
          rm -f "${DIR}.7z" ~/.config/rclone/rclone.conf
